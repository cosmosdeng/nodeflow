name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]
  workflow_dispatch:

jobs:
  test:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (renderer)
        run: bunx tsc --noEmit

      - name: Typecheck (electron)
        run: bunx tsc -p tsconfig.electron.json --noEmit

      - name: Lint (ESLint)
        run: bun run lint

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Unit tests
        run: bun run test

      - name: Build (renderer + electron)
        run: bun run build
