<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23262b"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#7c6ff0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- 连接线 -->
  <path d="M40 52 L88 76" stroke="#8b93a3" stroke-width="4" stroke-linecap="round"/>
  <path d="M40 88 L64 76" stroke="#8b93a3" stroke-width="4" stroke-linecap="round"/>
  <!-- 节点:参与方(行)/执行主体 -->
  <rect x="24" y="34" width="34" height="34" rx="9" fill="#f2b84b" opacity="0.16"/>
  <rect x="24" y="34" width="34" height="34" rx="9" fill="none" stroke="#f2b84b" stroke-width="3"/>
  <circle cx="41" cy="51" r="3.5" fill="#f2b84b"/>
  <!-- 节点:阶段 -->
  <rect x="80" y="66" width="34" height="34" rx="9" fill="#4f8ef7" opacity="0.16"/>
  <rect x="80" y="66" width="34" height="34" rx="9" fill="none" stroke="#4f8ef7" stroke-width="3"/>
  <circle cx="97" cy="83" r="3.5" fill="#4f8ef7"/>
  <!-- 节点:下游 -->
  <rect x="24" y="72" width="28" height="28" rx="8" fill="#3ecf8e" opacity="0.16"/>
  <rect x="24" y="72" width="28" height="28" rx="8" fill="none" stroke="#3ecf8e" stroke-width="3"/>
  <circle cx="38" cy="86" r="3" fill="#3ecf8e"/>
</svg>
